name: Publicar no GitHub Pages

# O ambiente github-pages só aceita implantações da branch PADRÃO do
# repositório. Se um dia a branch padrão mudar (ex.: para "main"),
# troque o nome abaixo.
on:
  push:
    branches: [claude/material-registry-sap-n028rn]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Pages (ativa na primeira vez)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
